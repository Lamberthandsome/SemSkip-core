spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.semskip org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.semskip.catalog-impl org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.semskip.uri jdbc:postgresql://postgres:5432/iceberg_catalog
spark.sql.catalog.semskip.jdbc.user iceberg
spark.sql.catalog.semskip.jdbc.driver-class org.postgresql.Driver
spark.sql.catalog.semskip.warehouse s3://warehouse/
spark.sql.catalog.semskip.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.semskip.s3.endpoint http://minio:9000
spark.sql.catalog.semskip.s3.path-style-access true
spark.sql.catalog.semskip.s3.region us-east-1
spark.sql.catalog.semskip.schema-version V1
spark.master local[2]
spark.driver.memory 2g
